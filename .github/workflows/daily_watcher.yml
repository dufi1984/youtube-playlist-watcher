name: YouTube Playlist Watcher Daily Check

on:
  schedule:
    # Runs automatically every day at midnight (UTC)
    - cron: '0 0 * * *'
  # Allows manual trigger with optional test notification check
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Send test notification email (FORCE TEST ALERT)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run multi-playlist watcher runner
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PLAYLIST_ID: ${{ secrets.PLAYLIST_ID }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        FORCE_TEST_ALERT: ${{ inputs.send_test_notification }}
      run: |
        python runner.py

    - name: Create GitHub Issue notification on change or test
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -s changes_report.txt ]; then
          echo "Changes or test report detected! Creating a GitHub Issue for email notification..."
          gh issue create --title "⚠️ YouTube Playlist Értesítő / Teszt" --body-file changes_report.txt
        else
          echo "No playlist changes detected and test not requested."
        fi

    - name: Commit and push changes back to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *.json || true
        if git diff --staged --quiet; then
          echo "No changes in playlist dump files."
        else
          git commit -m "Automated daily playlist dump & status update"
          git push
        fi
