name: YouTube Playlist Watcher Daily Check

on:
  schedule:
    # Runs automatically every day at midnight (UTC)
    - cron: '0 0 * * *'
  # Allows manual trigger with optional test notification check
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Send test notification (GitHub Issue)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Send test notification if requested
      if: ${{ inputs.send_test_notification }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue create --title "🧪 Teszt Értesítés - YouTube Playlist Watcher" --body "Ez egy teszt értesítés! Ha ezt az értesítést megkaptad e-mailben (vagy mobil push értesítésként a GitHub appban), az azt jelenti, hogy az értesítési rendszer 100%-ban működik."

    - name: Run multi-playlist watcher runner
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PLAYLIST_ID: ${{ secrets.PLAYLIST_ID }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      run: |
        python runner.py

    - name: Create GitHub Issue notification on change
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -s changes_report.txt ] && grep -q "Changes detected" changes_report.txt; then
          echo "Changes detected! Creating a GitHub Issue for notification..."
          gh issue create --title "⚠️ YouTube Playlist Változás Értesítő" --body-file changes_report.txt
        else
          echo "No playlist changes detected."
        fi

    - name: Commit and push changes back to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *.json || true
        if git diff --staged --quiet; then
          echo "No changes in playlist dump files."
        else
          git commit -m "Automated daily playlist dump & status update"
          git push
        fi
