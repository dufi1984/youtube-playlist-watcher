name: YouTube Playlist Watcher Hourly Check

on:
  schedule:
    # Runs hourly every day from 07:00 to 20:00 Hungarian time (05:00-18:00 UTC)
    - cron: '0 5-18 * * *'
  # Allows manual trigger with optional test notification check
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Send test notification email (FORCE TEST ALERT)'
        type: boolean
        default: false
      test_email:
        description: 'Target email for test'
        type: string
        default: ''
      test_title:
        description: 'Playlist title for test'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run multi-playlist watcher runner
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PLAYLIST_ID: ${{ secrets.PLAYLIST_ID }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        FORCE_TEST_ALERT: ${{ inputs.send_test_notification }}
        TEST_EMAIL: ${{ inputs.test_email }}
        TEST_TITLE: ${{ inputs.test_title }}
      run: |
        python runner.py || true

    - name: Commit and push changes back to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Automated playlist dumps & status update" || echo "No changes to commit"
        git pull --rebase origin main || true
        git push || echo "Push skipped or completed"
